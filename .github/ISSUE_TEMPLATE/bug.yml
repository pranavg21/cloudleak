name: Bug report
description: Something CloudLeak did wrong. Never include billing data.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command, exit code, and the message. Run with CLOUDLEAK_DEBUG=1 for a traceback (check it holds no data values).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cloudleak --version, OS and Python version
    validations:
      required: true
