name: Temporary dependency lock migration
on:
  push:
    branches: [fix/evidence-first-audit-v2]
    paths: [.github/workflows/refresh-frontend-lock.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-first-audit-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependencies
        working-directory: frontend
        run: |
          npm install --save-exact --no-audit --no-fund next@16.4.6 react@19.2.9 react-dom@19.2.9
          npm audit fix --no-fund || true
          npm audit --omit=dev --audit-level=high
      - name: Commit updated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade to supported Next.js and fix vulnerable dependency tree"
            git push origin HEAD:fix/evidence-first-audit-v2
          fi
