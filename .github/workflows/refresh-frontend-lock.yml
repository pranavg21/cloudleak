name: One-time Next.js dependency migration
on:
  push:
    branches: [fix/evidence-first-audit-v2]
    paths: [.github/workflows/refresh-frontend-lock.yml]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-first-audit-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upgrade and lock patched frontend packages
        working-directory: frontend
        run: |
          npm install --save-exact --no-audit --no-fund next@15.5.29 react@19.2.9 react-dom@19.2.9
          npm install --save-dev --save-exact --no-audit --no-fund @types/react@19 @types/react-dom@19
      - name: Commit resolved lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update frontend to patched Next.js and React releases"
            git push origin HEAD:fix/evidence-first-audit-v2
          fi
