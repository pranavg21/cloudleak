name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.6
      - run: ruff check src tests scripts

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Bundled samples stay consistent with the generator
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -c "from cloudleak.fixtures import generate; generate('regen')"
          diff -r samples regen

  oldest-duckdb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "duckdb==1.3.2"
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.2.2 pip-audit==2.7.3
      - run: python -m build
      - name: Run the wheel quickstart in an empty directory
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          export PATH="/tmp/w/bin:$PATH"
          mkdir "$RUNNER_TEMP/first-run"
          cd "$RUNNER_TEMP/first-run"
          cloudleak --version
          cloudleak demo -q
          test -s cloudleak-demo/report.html
          status=0
          cloudleak reconcile cloudleak-demo/m1 --invoices cloudleak-demo/invoices.csv || status=$?
          test "$status" -eq 1
          cloudleak reconcile cloudleak-demo/m1 --invoice-id EUINAA26090001 --currency USD --total 27206.81 --tolerance 0.01
          cloudleak doctor cloudleak-demo/m2
          cloudleak variance cloudleak-demo/m1 cloudleak-demo/m2 -o brief.html
          test -s brief.html
      - name: Audit runtime dependencies for known vulnerabilities
        run: /tmp/w/bin/python -m pip freeze --exclude-editable > /tmp/req.txt && pip-audit -r /tmp/req.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloudleak:ci .
      - name: Run offline, read-only, non-root
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --network=none --read-only --tmpfs /tmp:size=512m \
            -v "$PWD/samples:/data:ro" -v "$PWD/out:/out" cloudleak:ci audit /data/m1 /data/m2 -o /out/brief.html -q
          test -s out/brief.html

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: samples/m1
          fail-on: fail
      - run: test -s cloudleak-doctor.xml && test -s cloudleak-doctor.sarif
