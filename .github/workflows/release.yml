name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build==1.2.2 cyclonedx-bom==4.6.1
      - run: python -m pytest
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import cloudleak; print(cloudleak.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - name: Software bill of materials (CycloneDX)
        run: |
          python -m venv /tmp/sbom && /tmp/sbom/bin/pip install dist/*.whl
          cyclonedx-py environment /tmp/sbom/bin/python --output-format JSON -o dist/cloudleak-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write      # PyPI trusted publishing (OIDC); no stored token
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: Keep only Python distributions for upload
        run: mkdir upload && cp dist/*.whl dist/*.tar.gz upload/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload/

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
